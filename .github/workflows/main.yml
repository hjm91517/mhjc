name: mhjc 全自动部署

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:        # 支持手动触发

concurrency:
  group: mhjc-deploy
  cancel-in-progress: false  # 保证部署串行，防止并发写入

env:
  PYTHON_VERSION: '3.11'
  DEPLOY_PATH: /var/www/mhjc

jobs:
  # ─────────────────────────────────────────────
  #  阶段 1：代码质量检查（防止坏代码上线）
  # ─────────────────────────────────────────────
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Python 语法检查
        run: |
          # 只检查严重错误，不阻断小问题
          flake8 server.py --count --select=E9,F63,F7,F82 \
            --show-source --statistics

      - name: 前端文件存在性检查
        run: |
          test -f static/index.html || (echo "❌ 缺少 static/index.html" && exit 1)
          test -f static/admin.html || (echo "❌ 缺少 static/admin.html" && exit 1)
          echo "✅ 前端文件齐全"

      - name: server.py 可导入检查
        run: |
          python -c "
          import ast, sys
          src = open('server.py', encoding='utf-8').read()
          try:
              ast.parse(src)
              print('✅ server.py 语法正确')
          except SyntaxError as e:
              print('❌ server.py 语法错误:', e)
              sys.exit(1)
          "

  # ─────────────────────────────────────────────
  #  阶段 2：打包产物（带上 commit SHA）
  # ─────────────────────────────────────────────
  build:
    name: 构建产物
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
      archive:   ${{ steps.vars.outputs.archive }}
    steps:
      - uses: actions/checkout@v4

      - name: 生成版本号
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          ARCHIVE="mhjc-${SHA_SHORT}.tar.gz"
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT
          echo "archive=$ARCHIVE"     >> $GITHUB_OUTPUT
          echo "本次版本：$SHA_SHORT"

      - name: 打包项目
        run: |
          # 排除不需要上传的文件
          tar -czf ${{ steps.vars.outputs.archive }} \
            --exclude='.git' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='data' \
            --exclude='apps' \
            --exclude='.github' \
            .
          ls -lh ${{ steps.vars.outputs.archive }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mhjc-build
          path: ${{ steps.vars.outputs.archive }}
          retention-days: 7

  # ─────────────────────────────────────────────
  #  阶段 3：上传到服务器并执行远程部署
  # ─────────────────────────────────────────────
  deploy:
    name: 部署到服务器
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ secrets.SERVER_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: mhjc-build

      - name: 准备 SSH 环境
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # 首次连接不询问指纹
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          # 校验 SSH 连通性
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "echo '✅ SSH 连接成功'"

      - name: 上传打包文件
        run: |
          scp -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            ${{ needs.build.outputs.archive }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/

      - name: 远程执行部署脚本
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "sudo bash ${{ env.DEPLOY_PATH }}/deploy/deploy.sh \
              '${{ needs.build.outputs.archive }}' \
              '${{ needs.build.outputs.sha_short }}'"

      - name: 健康检查
        run: |
          echo "等待服务启动…"
          sleep 8
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 5 \
                 https://${{ secrets.SERVER_HOST }}/api/ping >/dev/null 2>&1; then
              echo "✅ 服务健康检查通过"
              exit 0
            fi
            echo "第 $i 次检查失败，5 秒后重试…"
            sleep 5
          done
          echo "❌ 健康检查失败，请检查服务器日志"
          exit 1

      - name: 部署成功通知
        if: success()
        run: |
          echo "🎉 mhjc 部署成功"
          echo "版本：${{ needs.build.outputs.sha_short }}"
          echo "访问：https://${{ secrets.SERVER_HOST }}"

      - name: 部署失败回滚
        if: failure()
        run: |
          echo "⚠️ 部署失败，正在尝试回滚到上一个版本…"
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "sudo bash ${{ env.DEPLOY_PATH }}/deploy/rollback.sh || true"
